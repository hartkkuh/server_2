name: Proxy Tunnel

on:
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:

      # ==========================================
      # Checkout
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # Python
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # Dependencies
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "websockets>=15,<16"


      # ==========================================
      # Start Runner
      # ==========================================

      - name: Start tunnel
        env:
          RENDER_WS: ${{ secrets.RELAY_URL }}
          PROXY_TOKEN: ${{ secrets.RELAY_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u runner.py