name: Internet Proxy

on:
  workflow_dispatch:

jobs:

  proxy:

    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:

      # ----------------------------------------
      # Install packages
      # ----------------------------------------

      - name: Install Squid and Python
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            squid \
            curl \
            python3 \
            python3-pip

      # ----------------------------------------
      # Configure Squid
      # ----------------------------------------

      - name: Configure Squid
        run: |

          sudo tee /etc/squid/squid.conf > /dev/null <<'EOF'

          http_port 127.0.0.1:3128

          acl localnet src 127.0.0.1/32

          http_access allow localnet
          http_access deny all

          cache deny all

          forwarded_for delete
          via off

          access_log none

          EOF

          sudo squid -k parse

          sudo systemctl restart squid

      # ----------------------------------------
      # Test Squid
      # ----------------------------------------

      - name: Test Squid
        run: |

          echo "Direct Internet IP:"
          curl -4 https://ifconfig.me

          echo

          echo "Proxy Internet IP:"
          curl \
            --proxy http://127.0.0.1:3128 \
            https://ifconfig.me

          echo

          echo "Squid listening:"
          sudo ss -lntp | grep 3128

      # ----------------------------------------
      # Install WebSocket client
      # ----------------------------------------

      - name: Install Python WebSocket library
        run: |

          python3 -m pip install \
            --user \
            websockets==15.0.1

      # ----------------------------------------
      # Create runner.py
      # ----------------------------------------

      - name: Create runner
        env:

          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}

        run: |

          cat > runner.py <<'PYTHON'

          import asyncio
          import json
          import os

          import websockets


          RELAY_URL = os.environ["RELAY_URL"]
          TOKEN = os.environ["RELAY_TOKEN"]

          SQUID_HOST = "127.0.0.1"
          SQUID_PORT = 3128


          async def bridge_connection(client_id):

              bridge_url = (
                  RELAY_URL
                  .replace(
                      "/ws/control",
                      f"/ws/bridge/{client_id}",
                  )
              )

              print(
                  f"Opening bridge: {client_id}",
                  flush=True,
              )

              try:

                  async with websockets.connect(
                      bridge_url,
                      ping_interval=20,
                      ping_timeout=20,
                      max_size=None,
                  ) as ws:

                      await ws.send(
                          json.dumps({
                              "type": "auth",
                              "role": "bridge",
                              "token": TOKEN,
                          })
                      )

                      reader, writer = await asyncio.open_connection(
                          SQUID_HOST,
                          SQUID_PORT,
                      )


                      async def websocket_to_squid():

                          try:

                              async for message in ws:

                                  if isinstance(
                                      message,
                                      bytes,
                                  ):

                                      writer.write(
                                          message
                                      )

                                      await writer.drain()

                          except Exception:
                              pass


                      async def squid_to_websocket():

                          try:

                              while True:

                                  data = await reader.read(
                                      65536
                                  )

                                  if not data:
                                      break

                                  await ws.send(data)

                          except Exception:
                              pass


                      await asyncio.gather(
                          websocket_to_squid(),
                          squid_to_websocket(),
                      )


                      writer.close()

                      try:
                          await writer.wait_closed()
                      except Exception:
                          pass


              except Exception as e:

                  print(
                      f"Bridge error {client_id}:",
                      repr(e),
                      flush=True,
                  )


          async def runner():

              while True:

                  try:

                      print(
                          f"Connecting to {RELAY_URL}",
                          flush=True,
                      )

                      async with websockets.connect(
                          RELAY_URL,
                          ping_interval=20,
                          ping_timeout=20,
                          max_size=None,
                      ) as ws:

                          print(
                              "Connected to Render",
                              flush=True,
                          )

                          await ws.send(
                              json.dumps({
                                  "type": "auth",
                                  "role": "runner",
                                  "token": TOKEN,
                              })
                          )

                          print(
                              "Runner authenticated",
                              flush=True,
                          )

                          async for message in ws:

                              if not isinstance(
                                  message,
                                  str,
                              ):
                                  continue

                              data = json.loads(message)

                              if data.get(
                                  "type"
                              ) == "connect":

                                  client_id = data["id"]

                                  asyncio.create_task(
                                      bridge_connection(
                                          client_id
                                      )
                                  )


                  except Exception as e:

                      print(
                          "Runner connection error:",
                          repr(e),
                          flush=True,
                      )


                  print(
                      "Reconnecting in 5 seconds...",
                      flush=True,
                  )

                  await asyncio.sleep(5)


          asyncio.run(runner())

          PYTHON

      # ----------------------------------------
      # Start runner
      # ----------------------------------------

      - name: Start proxy runner
        env:

          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}

        run: |

          nohup python3 runner.py \
            > runner.log 2>&1 &

      # ----------------------------------------
      # Verify runner
      # ----------------------------------------

      - name: Verify runner
        run: |

          sleep 8

          echo "=============================="
          echo "RUNNER LOG"
          echo "=============================="

          cat runner.log || true

          echo
          echo "=============================="
          echo "PROCESS"
          echo "=============================="

          ps aux | grep '[r]unner.py' || true

          echo
          echo "=============================="
          echo "NETWORK"
          echo "=============================="

          ss -tnp | grep python || true

      # ----------------------------------------
      # Keep GitHub runner alive
      # ----------------------------------------

      - name: Keep proxy alive
        run: |

          while true; do

            echo
            echo "=============================="
            echo "$(date)"
            echo "PROXY RUNNING"
            echo "=============================="

            echo
            echo "Internet IP:"

            curl -4 \
              --max-time 10 \
              https://ifconfig.me || true

            echo
            echo "Squid:"

            sudo ss -lntp \
              | grep 3128 || true

            echo
            echo "Runner:"

            ps aux \
              | grep '[r]unner.py' \
              || true

            echo
            echo "Runner log:"

            tail -n 20 \
              runner.log \
              || true

            sleep 60

          done